name: lajur

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: lajur-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Lajur__Storage__RootPath: /srv/lajur
    ports:
      - "127.0.0.1:${LAJUR_API_PORT:-8080}:8080"
    volumes:
      - "${LAJUR_DATA_PATH:-./.local/lajur/data}:/srv/lajur/data"
      - "${LAJUR_BACKUPS_PATH:-./.local/lajur/backups}:/srv/lajur/backups"
      - "${LAJUR_TEMPLATES_PATH:-./.local/lajur/templates}:/srv/lajur/templates"
      - "${LAJUR_AUTH_PATH:-./.local/lajur/auth}:/srv/lajur/auth"
      - "${LAJUR_KEYS_PATH:-./.local/lajur/keys}:/srv/lajur/keys"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

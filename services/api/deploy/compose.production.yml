name: lajur-production

services:
  api:
    # First bootstrap builds this image natively on the ARM64 VPS from a fixed
    # Git commit. Set an exact local image ID; registry distribution comes later.
    image: ${LAJUR_IMAGE:?Set the verified API image ID in production.env}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: "lajur.solusi-program.site;localhost;127.0.0.1"
      Lajur__Storage__RootPath: /srv/lajur
      Lajur__ReverseProxy__TrustedNetworks__0: ${LAJUR_TRUSTED_PROXY_CIDR:?Set the dedicated Docker gateway /32}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /srv/lajur/data:/srv/lajur/data
      - /srv/lajur/backups:/srv/lajur/backups
      - /srv/lajur/templates:/srv/lajur/templates:ro
      - /srv/lajur/auth:/srv/lajur/auth
      - /srv/lajur/keys:/srv/lajur/keys
      - /srv/lajur/staging:/srv/lajur/staging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    external: true
    name: lajur-production

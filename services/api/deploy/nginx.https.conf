server {
    listen 80;
    server_name lajur.solusi-program.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-lajur;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://lajur.solusi-program.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lajur.solusi-program.site;

    ssl_certificate /etc/letsencrypt/live/lajur.solusi-program.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lajur.solusi-program.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LajurSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 30m;
    # Finance responses/URLs are not written to an access log.
    access_log off;
    error_log /var/log/nginx/lajur-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Direct-to-origin DNS-only deployment: ignore client-supplied XFF.
        # A future Cloudflare proxy needs scoped real_ip configuration first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

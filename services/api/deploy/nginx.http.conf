# Bootstrap only: serve ACME verification without exposing login/API over HTTP.
server {
    listen 80;
    server_name lajur.solusi-program.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-lajur;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Lajur HTTPS setup is in progress.\n";
    }
}
